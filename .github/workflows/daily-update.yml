name: Daily Profile Update

on:
  schedule:
    - cron: "0 0 * * *" # كل يوم الساعة 12 بليل
  workflow_dispatch:

jobs:
  update-content:
    runs-on: ubuntu-latest
    name: Update Quote & WakaTime

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 🔴 مهم علشان rebase يشتغل صح

      # 🔴 Node لازم يتظبط صراحة
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 1️⃣ تحديث WakaTime
      - name: Update WakaTime Stats
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SECTION_NAME: waka
          TIME_RANGE: all_time
          LANG_COUNT: 6

      # 2️⃣ تحديث المقولة (كوت + لون + log)
      - name: Update Daily Quote
        run: node scripts/update-quote.js

      # 3️⃣ Commit & Push (ملفات إضافية)
      - name: Commit & Push
        run: |
          git config user.name "Mohamed Abdelwahab"
          git config user.email "mohamedabdelwahabelazab@gmail.com"

          git add README.md data/*.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily quote & wakatime stats"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi

